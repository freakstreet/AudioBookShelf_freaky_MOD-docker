name: Freaky MOD tests and Docker
on:
  push:
    branches: [main]
    tags: ['v*-freaky.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Radio France generator tests
        run: python3 -m unittest discover -s tools/radiofrance/tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Catalogue and player tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.freaky
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Real MP3 and M4A embedded artwork tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.freaky
          target: artwork-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/freakstreet/audiobookshelf_freaky_mod-docker
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Build image (publish releases only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.freaky
          target: runtime
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
