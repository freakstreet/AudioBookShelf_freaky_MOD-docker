name: audiobookshelf-freaky
services:
  audiobookshelf:
    image: ghcr.io/freakstreet/audiobookshelf_freaky_mod-docker:v2.37.2-freaky.3
    restart: unless-stopped
    ports:
      - "13378:80"
    environment:
      TZ: Europe/Paris
    volumes:
      - /mnt/storage/appData/audiobookshelf-freaky/config:/config
      - /mnt/storage/appData/audiobookshelf-freaky/metadata:/metadata
      - /mnt/storage/appData/audiobookshelf-freaky/audiobooks:/audiobooks
      - /mnt/storage/appData/audiobookshelf-freaky/podcasts:/podcasts
